<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GobernIA — Hola</title>
<meta name="description" content="GobernIA · Licitaciones, subvenciones e IA para pymes y autónomos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bosque:#064E3B;
    --jade:#00A86B;
    --celadon:#7CABA3;
    --crema:#F4F1DE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    background:#EBE9E3;
    font-family:'Inter',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .panel{
    width:100%;
    max-width:380px;
    text-align:center;
  }
  .wordmark{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:2.6rem;
    color:var(--bosque);
    line-height:1;
  }
  .wordmark .ia{color:var(--jade);}
  .rule{
    width:56px;height:1.5px;
    background:var(--celadon);
    margin:16px auto 14px;
  }
  .tagline{
    line-height:2;
    font-size:.65rem;
    text-transform:uppercase;
    letter-spacing:.3em;
    color:var(--bosque);
    opacity:.75;
    margin-bottom:40px;
    padding-left:.3em;
  }
  .greeting{
    font-size:.95rem;
    color:#3c463f;
    margin-bottom:26px;
    line-height:1.5;
  }
  .btn{
    display:block;
    width:100%;
    padding:16px 20px;
    margin-bottom:14px;
    border-radius:12px;
    text-decoration:none;
    font-weight:600;
    font-size:1rem;
    letter-spacing:.02em;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn-web{
    background:var(--bosque);
    color:var(--crema);
    box-shadow:0 6px 18px rgba(6,78,59,.25);
  }
  .btn-ig{
    background:transparent;
    color:var(--bosque);
    border:2px solid var(--jade);
  }
  .btn small{
    display:block;
    font-weight:400;
    font-size:.72rem;
    opacity:.7;
    margin-top:3px;
    letter-spacing:.03em;
  }
  .foot{
    margin-top:36px;
    font-size:.72rem;
    color:var(--celadon);
    letter-spacing:.06em;
  }
  .foot a{color:var(--bosque);text-decoration:none;font-weight:500;}
  @media (prefers-reduced-motion: reduce){
    .btn{transition:none;}
  }
</style>
</head>
